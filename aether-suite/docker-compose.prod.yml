version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: aether-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rfp-tool:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: rfp-tool
    container_name: aether-rfp-tool-prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  compliance-tool:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: compliance-tool
    container_name: aether-compliance-tool-prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3002 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  market-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: market-analyzer
    container_name: aether-market-analyzer-prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3003 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  proposal-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: proposal-optimizer
    container_name: aether-proposal-optimizer-prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3004 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  landing-critic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: landing-critic
    container_name: aether-landing-critic-prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3005 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  mongodb-data:
